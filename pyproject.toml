[project]
name = "formulabench"
version = "0.1.0"
description = "A reproducible system for generating and validating complex Excel formulas."
requires-python = ">=3.11"
dependencies = [
    "openpyxl==3.1.5",
    "pydantic>=2.12,<3",
    "tinker==0.27.1",
    "tokenizers==0.22.2",
    "transformers[chat-template]==5.5.4",
]

[project.optional-dependencies]
baseline = [
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-ai-slim[openrouter]>=2.38.0",
]
native-tinker = [
    "tinker-cookbook==0.5.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.9.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel.force-include]
"sb.py" = "sb.py"
