  <script>
    (() => {
      const formulaText = document.getElementById("01-open-not-correct-formula-text");
      const caret = document.getElementById("01-open-not-correct-caret");
      const result = document.getElementById("01-open-not-correct-result");
      const opened = document.getElementById("01-open-not-correct-opened");
      const audit = document.getElementById("01-open-not-correct-audit");
      const expectedLabel = document.getElementById("01-open-not-correct-expected-label");
      const expected = document.getElementById("01-open-not-correct-expected");
      const targetCell = document.getElementById("01-open-not-correct-target-cell");
      const stamp = document.getElementById("01-open-not-correct-stamp");
      const stage = document.querySelector('[class~="01-open-not-correct-stage"]');

      const formulaStates = [
        { t: 0.00, text: "", color: "#F4F0E6" },
        { t: 0.14, text: "=", color: "#F4F0E6" },
        { t: 0.27, text: "=SUM", color: "#2CCB8C" },
        { t: 0.43, text: "=SUMPRODUCT(", color: "#2CCB8C" },
        { t: 0.61, text: "=SUMPRODUCT(Uni", color: "#5DB8A6" },
        { t: 0.82, text: "=SUMPRODUCT(Units,", color: "#5DB8A6" },
        { t: 1.04, text: "=SUMPRODUCT(Units,Entry", color: "#5DB8A6" },
        { t: 1.28, text: "=SUMPRODUCT(Units,EntryPrice", color: "#5DB8A6" },
        { t: 1.52, text: "=SUMPRODUCT(Units,EntryPrice)", color: "#2CCB8C" }
      ];

      const entryAt = (time) => {
        for (let index = formulaStates.length - 1; index >= 0; index -= 1) {
          if (time >= formulaStates[index].t) return formulaStates[index];
        }
        return formulaStates[0];
      };

      const changeTimes = formulaStates.slice(1).map((entry) => entry.t);
      const typeDriver = { t: 0 };
      const blinkDriver = { p: 0 };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        stage,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        0.04
      );

      tl.to(
        typeDriver,
        {
          t: 1.8,
          duration: 1.8,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(typeDriver.t);
            formulaText.textContent = entry.text;
            caret.style.background = entry.color;
          }
        },
        0
      );

      tl.to(
        blinkDriver,
        {
          p: Math.PI * 2 * 6,
          duration: 3.6,
          ease: "none",
          onUpdate: () => {
            const isTyping = changeTimes.some(
              (changeTime) => changeTime <= typeDriver.t && typeDriver.t - changeTime < 0.11
            );
            caret.style.opacity = isTyping || Math.sin(blinkDriver.p) > 0 ? "1" : "0";
          }
        },
        0
      );

      tl.fromTo(
        targetCell,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
        1.68
      );
      tl.fromTo(
        result,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" },
        1.82
      );
      tl.fromTo(
        opened,
        { opacity: 0, scale: 0.82 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" },
        2.18
      );
      tl.fromTo(
        audit,
        { opacity: 0, scaleX: 0.08 },
        { opacity: 1, scaleX: 1, duration: 0.66, ease: "power3.out" },
        2.04
      );
      tl.fromTo(
        expectedLabel,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        2.56
      );
      tl.fromTo(
        expected,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        2.82
      );

      tl.to(
        targetCell,
        { borderColor: "#C64545", duration: 0.22, ease: "none" },
        3.6
      );
      tl.fromTo(
        stamp,
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        3.6
      );
      tl.set(caret, { opacity: 0 }, 3.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-open-not-correct"] = tl;
    })();
  </script>
