        pathOne,
        { strokeDashoffset: 0, duration: 0.86, ease: "power2.out" },
        1.18
      );

      tl.to(
        cam,
        { x: -1920, duration: 1.08, ease: "power3.inOut", onUpdate: applyCamera },
        2.2
      );

      sheets.forEach((sheet, index) => {
        tl.fromTo(
          sheet,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
          3.2 + index * 0.18
        );
      });
      formulas.forEach((formula, index) => {
        tl.fromTo(
          formula,
          { opacity: 0, x: 18 },
          { opacity: 1, x: 0, duration: 0.38, ease: "power3.out" },
          3.52 + index * 0.28

      dimRegions.forEach((region) => {
        tl.fromTo(
          region,
          { opacity: 0.55 },
          { opacity: 0.18, duration: 0.48, ease: "power1.out" },
          4.03

      });
      tl.to(
        pathTwo,
        { strokeDashoffset: 0, duration: 0.56, ease: "power2.out" },
        4.08

      tl.to(
        cam,
        { x: -3840, duration: 1.08, ease: "power3.inOut", onUpdate: applyCamera },
        4.7

        modelCard,
        { opacity: 0, y: 16 },
