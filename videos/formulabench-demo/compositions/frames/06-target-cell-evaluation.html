  <script>
    (() => {
      const compositionId = "06-target-cell-evaluation";
      const root = document.querySelector('[data-composition-id="06-target-cell-evaluation"]');
      if (!root || typeof gsap === "undefined") return;

      const byId = (suffix) => document.getElementById(compositionId + "-" + suffix);
      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      const scene = root.querySelector('[class~="06-target-cell-evaluation-scene"]');
      const receipt = byId("receipt");
      const kicker = byId("kicker");
      const title = byId("title");
      const headingState = byId("heading-state");
      const sheet = byId("sheet");
      const stateIds = ["open", "recalculate", "save"];
      const cellIds = ["a", "b", "c", "d", "e", "f"];
      const matchIds = ["a", "b", "c", "d", "e"];

      tl.fromTo(scene, { scale: 0.995 }, { scale: 1, duration: 7.95, ease: "none" }, 0);
      tl.fromTo(receipt, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.46, ease: "power2.out" }, 0.08);
      tl.fromTo(kicker, { autoAlpha: 0, y: 9 }, { autoAlpha: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.03);
      tl.fromTo(title, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.52, ease: "power2.out" }, 0.1);
      tl.fromTo(headingState, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.42);

      stateIds.forEach((stateId, index) => {
        const at = 0.45 + index * 0.52;
        tl.fromTo(
          byId(`state-${stateId}`),
          { autoAlpha: 0, y: 10 },
          { autoAlpha: 1, y: 0, duration: 0.32, ease: "power2.out" },
          at,
        );
        tl.to(
          byId(`dot-${stateId}`),
          { backgroundColor: "#5DB872", borderColor: "#5DB872", duration: 0.2, ease: "power1.out" },
          at + 0.22,
        );
      });
      tl.fromTo(
        byId("version"),
        { autoAlpha: 0, x: -12 },
        { autoAlpha: 1, x: 0, duration: 0.38, ease: "power2.out" },
        1.72,
      );

      tl.fromTo(sheet, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.48, ease: "power2.out" }, 2.18);

      cellIds.forEach((cellId, index) => {
        const cell = byId(`cell-${cellId}`);
        const targetX = Number(cell.dataset.targetX);
        const targetY = Number(cell.dataset.targetY);
        tl.fromTo(
          cell,
          {
            xPercent: -50,
            yPercent: -50,
            x: targetX * 0.3,
            y: targetY * 0.3,
            scale: 0.92,
            autoAlpha: 0,
          },
          {
            x: targetX,
            y: targetY,
            scale: 1,
            autoAlpha: 1,
            duration: 1.15,
            ease: "power3.out",
          },
          2.4 + index * 0.08,
        );
      });

      const valueBlocks = root.querySelectorAll('[class~="06-target-cell-evaluation-value"]');
      tl.fromTo(
        valueBlocks,
        { autoAlpha: 0, y: 10 },
        { autoAlpha: 1, y: 0, duration: 0.34, stagger: 0.09, ease: "power2.out" },
        3.72,
      );

      matchIds.forEach((cellId, index) => {
        const at = 5.18 + index * 0.1;
        tl.to(
          byId(`cell-${cellId}`),
          { borderColor: "#5DB872", duration: 0.28, ease: "power1.out" },
          at,
        );
        tl.to(
          byId(`result-${cellId}`),
          { color: "#5DB872", duration: 0.2, ease: "power1.out" },
          at,
        );
        tl.set(byId(`result-${cellId}`), { textContent: "Match" }, at);
      });

      const headingStates = [
        { t: 0, text: "TARGET-CELL COMPARISON" },
        { t: 0.95, text: "EXECUTABLE, STILL WRONG" },
      ];
      const headingAt = (time) => {
        for (let index = headingStates.length - 1; index >= 0; index -= 1) {
          if (time >= headingStates[index].t) return headingStates[index].text;
        }
        return headingStates[0].text;
      };
      const headingDriver = { t: 0 };
      let lastHeading = "";
      tl.to(
        headingDriver,
        {
          t: 1.8,
          duration: 1.8,
          ease: "none",
          onUpdate: () => {
            const nextHeading = headingAt(headingDriver.t);
            if (nextHeading !== lastHeading) {
              headingState.textContent = nextHeading;
              lastHeading = nextHeading;
            }
          },
        },
        5.2,
      );

      tl.to(
        byId("mismatch-bar"),
        { scaleX: 0.62, backgroundColor: "#C64545", duration: 0.36, ease: "power2.out" },
        6.12,
      );
      tl.to(
        byId("cell-f"),
        { borderColor: "#C64545", backgroundColor: "#F8D5D5", duration: 0.32, ease: "power1.out" },
        6.12,
      );
      tl.set(byId("result-f"), { textContent: "Mismatch" }, 6.12);
      tl.to(byId("result-f"), { color: "#C64545", duration: 0.22, ease: "power1.out" }, 6.12);
    })();
  </script>
</template>
