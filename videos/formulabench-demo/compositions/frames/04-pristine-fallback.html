  <script>
    (() => {
      const plan = document.getElementById("04-pristine-fallback-plan");
      const working = document.getElementById("04-pristine-fallback-working");
      const workingText = document.getElementById("04-pristine-fallback-working-text");
      const rejected = document.getElementById("04-pristine-fallback-rejected");
      const spinnerArc = document.getElementById("04-pristine-fallback-spinner-arc");
      const ownershipRow = document.getElementById("04-pristine-fallback-row-ownership");
      const pathsRow = document.getElementById("04-pristine-fallback-row-paths");
      const limitsRow = document.getElementById("04-pristine-fallback-row-limits");
      const checkState = document.getElementById("04-pristine-fallback-state-check");
      const failedState = document.getElementById("04-pristine-fallback-state-failed");
      const receipt = document.getElementById("04-pristine-fallback-receipt");
      const inputRow = document.getElementById("04-pristine-fallback-input-row");
      const recordRow = document.getElementById("04-pristine-fallback-record-row");
      const partialRow = document.getElementById("04-pristine-fallback-partial-row");
      const reason = document.getElementById("04-pristine-fallback-reason");

      const workingStates = [
        { t: 0.00, text: "" },
        { t: 0.12, text: "CHECK" },
        { t: 0.34, text: "CHECKING" },
        { t: 0.58, text: "CHECKING PLAN" }
      ];
      const textAt = (time) => {
        for (let index = workingStates.length - 1; index >= 0; index -= 1) {
          if (time >= workingStates[index].t) return workingStates[index].text;
        }
        return "";
      };

      const typeDriver = { t: 0 };
      const spinDriver = { deg: 0 };
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        plan,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        0.04
      );
      tl.to(
        typeDriver,
        {
          t: 2,
          duration: 2,
          ease: "none",
          onUpdate: () => {
            workingText.textContent = textAt(typeDriver.t);
          }
        },
        0
      );
      tl.to(
        spinDriver,
        {
          deg: 540,
          duration: 2,
          ease: "none",
          onUpdate: () => {
            spinnerArc.setAttribute("transform", `rotate(${spinDriver.deg} 40 40)`);
          }
        },
        0
      );

      [ownershipRow, pathsRow, limitsRow].forEach((row, index) => {
        tl.fromTo(
          row,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
          0.62 + index * 0.4
        );
      });

      tl.to(
        ownershipRow,
        {
          backgroundColor: "#C64545",
          borderColor: "#C64545",
          duration: 0.24,
          ease: "none"
        },
        2
      );
      tl.to(checkState, { opacity: 0, duration: 0.18, ease: "none" }, 2);
      tl.fromTo(
        failedState,
        { opacity: 0, scale: 0.8 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
        2.08
      );

      tl.to(
        working,
        { opacity: 0, scale: 0.72, duration: 0.34, ease: "power2.in" },
        2.08
      );
      tl.fromTo(
        rejected,
        { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        2.26
      );

      tl.to(
        plan,
        { opacity: 0, scale: 0.72, duration: 0.42, ease: "power2.in" },
        4.2
      );
      tl.fromTo(
        receipt,
        { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.58, ease: "power3.out" },
        4.46
      );

      [inputRow, recordRow, partialRow].forEach((row, index) => {
        tl.fromTo(
          row,
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
          5.03 + index * 0.25
        );
      });
      tl.fromTo(
        reason,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        5.78
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["04-pristine-fallback"] = tl;
    })();
  </script>
