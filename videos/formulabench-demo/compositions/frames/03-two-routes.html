  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "03-two-routes";
      const root = document.querySelector('[data-composition-id="03-two-routes"]');
      if (!root || typeof gsap === "undefined") return;

      const byId = (suffix) => document.getElementById(compositionId + "-" + suffix);
      const tl = gsap.timeline({ paused: true });

      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      const scene = root.querySelector('[class~="03-two-routes-scene"]');
      const title = byId("title");
      const meta = byId("meta");
      const plan = byId("plan");
      const leftCard = byId("left-card");
      const leftLabel = byId("left-label");
      const rightCard = byId("right-card");
      const rightLabel = byId("right-label");
      const validator = byId("validator");

      const drawRail = (suffix, start, duration) => {
        tl.fromTo(
          byId(suffix),
          { strokeDashoffset: 1 },
          { strokeDashoffset: 0, duration, ease: "power1.inOut" },
          start,
        );
      };

      const buildSequence = (entries, start, end) => {
        const baseDuration = 0.68;
        const secondsPerCharacter = 0.028;
        const weighted = entries.map((entry, index) => ({
          ...entry,
          weight: baseDuration + entry.body.length * secondsPerCharacter + (index === entries.length - 1 ? 0.5 : 0.22),
        }));
        const totalWeight = weighted.reduce((sum, entry) => sum + entry.weight, 0);
        let cursor = start;
        return weighted.map((entry) => {
          const span = ((end - start) * entry.weight) / totalWeight;
          const timed = { ...entry, start: cursor, end: cursor + span };
          cursor += span;
          return timed;
        });
      };

      const revealSequence = (entries, start, end) => {
        buildSequence(entries, start, end).forEach((entry) => {
          const revealDuration = Math.min(0.42, (entry.end - entry.start) * 0.5);
          tl.fromTo(
            byId(entry.id),
            { autoAlpha: 0, y: 16 },
            { autoAlpha: 1, y: 0, duration: revealDuration, ease: "power2.out" },
            entry.start,
          );
        });
      };

      tl.fromTo(scene, { scale: 0.99 }, { scale: 1, duration: 8.45, ease: "none" }, 0);
      tl.fromTo(meta, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.38, ease: "power2.out" }, 0.02);
      tl.fromTo(title, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.08);
      tl.fromTo(plan, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.46, ease: "power2.out" }, 0.22);
      drawRail("entry-rail", 0.42, 1.55);

      drawRail("left-branch", 1.9, 0.82);
      tl.fromTo(leftCard, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: "power2.out" }, 2.42);
      tl.fromTo(leftLabel, { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.out" }, 2.68);
      revealSequence(
        [
          { id: "set-value", body: "set value" },
          { id: "set-formula", body: "set formula" },
          { id: "copy-style", body: "copy style" },
        ],
        3.08,
        5.45,
      );

      drawRail("right-branch", 5.08, 0.72);
      tl.fromTo(rightCard, { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: "power2.out" }, 5.38);
      tl.fromTo(rightLabel, { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.out" }, 5.62);
      revealSequence(
        [
          { id: "limited-imports", body: "limited imports" },
          { id: "resource-caps", body: "resource caps" },
        ],
        6.02,
        7.68,
      );

      drawRail("left-return", 7.66, 0.48);
      drawRail("right-return", 7.66, 0.48);
      tl.fromTo(
        validator,
        { autoAlpha: 0, y: 14, scale: 0.96 },
        { autoAlpha: 1, y: 0, scale: 1, duration: 0.3, ease: "power2.out" },
        7.92,
      );
    })();
  </script>
